server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver DNS de Docker con TTL corto: si un contenedor se recrea y
    # cambia de IP, nginx lo re-resuelve en <=10s en vez de cachear la vieja
    # para siempre (causa de 502 tras recrear servicios).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    # SPA: todo lo que no sea API cae al index.html de React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Rutas del frontend (baseURL /api) ────────────────────────

    # /api/auth/v1/...  ->  Kong  /auth/v1/...
    # (con proxy_pass via variable nginx NO reescribe la URI solo:
    #  se reescribe explicitamente quitando el prefijo /api)
    location /api/auth/ {
        set $kong_upstream http://osda-supabase-kong:8000;
        rewrite ^/api/auth/(.*)$ /auth/$1 break;
        proxy_pass $kong_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # /api/personas/{id} -> PostgREST con ID (DELETE, PATCH, GET by ID)
    # DEBE ir ANTES que /api/personas/ para que nginx lo match primero
    location ~ "^/api/personas/([0-9a-f-]{36})$" {
        set $persona_id $1;
        set $kong_pgrest http://osda-supabase-kong:8000;
        # PostgREST requiere DELETE con query param: ?id=eq.{uuid}
        # Usamos proxy_pass directo con query string
        proxy_pass http://osda-supabase-kong:8000/rest/v1/personas?id=eq.$1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # /api/personas/...  ->  Kong PostgREST  /rest/v1/personas/...
    # Proxy directo a PostgREST via Kong (evita backend FastAPI)
    location /api/personas/ {
        set $kong_pgrest http://osda-supabase-kong:8000;
        rewrite ^/api/personas/(.*)$ /rest/v1/personas/$1 break;
        proxy_pass $kong_pgrest;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # /api/personas (sin slash final) -> redirigir con slash
    location = /api/personas {
        return 301 /api/personas/;
    }

    # /api/personas (colección) -> PostgREST sin trailing slash
    location = /api/personas/ {
        set $kong_pgrest http://osda-supabase-kong:8000;
        proxy_pass $kong_pgrest/rest/v1/personas;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # /api/...  ->  backend FastAPI  /api/...
    location /api/ {
        set $backend_upstream http://osda-backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Rutas directas de Supabase (sin prefijo /api) ─────────────

    location /auth/ {
        set $kong_upstream2 http://osda-supabase-kong:8000;
        proxy_pass $kong_upstream2;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /graphify {
        set $graphify_upstream http://osda-graphify:8080;
        proxy_pass $graphify_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}