server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver DNS de Docker con TTL corto: si un contenedor se recrea y
    # cambia de IP, nginx lo re-resuelve en <=10s en vez de cachear la vieja
    # para siempre (causa de 502 " fantasma" tras recrear servicios).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        # variable obligatoria para que el resolver re-resuelva en runtime
        set $backend_upstream http://osda-backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/auth {
        set $kong_upstream http://osda-supabase-kong:8000;
        proxy_pass $kong_upstream/auth;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /auth {
        set $kong_upstream2 http://osda-supabase-kong:8000;
        proxy_pass $kong_upstream2;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /graphify {
        set $graphify_upstream http://osda-graphify:8080;
        proxy_pass $graphify_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}