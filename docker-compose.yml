# ─────────────────────────────────────────────────────────────────
# REDES AISLADAS
# ─────────────────────────────────────────────────────────────────
networks:
  osda-frontend:
    driver: bridge
    name: osda-frontend
  osda-backend:
    driver: bridge
    name: osda-backend
    enable_ipv6: false
